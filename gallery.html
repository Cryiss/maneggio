    <style>
        .gallery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 45px;
            padding: 40px 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .gallery-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Sfumatura applicata solo alle immagini */
        .gallery-container img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            border: none;
            outline: none;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 82%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 82%, rgba(0,0,0,0) 100%);
            transition: transform 0.3s ease;
        }

        .gallery-container img:hover {
            transform: scale(1.01);
        }

        /* --- STILE SUPER MODERNO PER IL VIDEO --- */
        .video-card {
            width: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .video-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }

        .video-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .video-title {
            color: #ffffff;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .video-badge {
            background: rgba(93, 216, 235, 0.15);
            color: #5dd8eb;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .gallery-container video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            outline: none;
            border: none;
        }
    </style>
</head>
